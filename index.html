</style></head><body><header class="top"><div class="topin"><button class="brand" onclick="go('home')" aria-label="Runlog, home"><span class="brandmark"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="m2 19 8-14h5L7 19zm9 0 8-14h4l-8 14z" fill="currentColor"/></svg></span>Runlog</button><nav class="topnav"><button data-view="home" onclick="go('home')">Panoramica</button><button data-view="new" onclick="go('new')">Registra</button><button data-view="stats" onclick="go('stats')">Attività e statistiche</button></nav><button class="backup" onclick="backup()">⇅ &nbsp; Backup</button></div></header><main id="app"></main><footer class="foot"><span class="micro">Runlog / Diario di corsa</span><span class="micro">Archivio personale</span></footer><dialog id="modal"></dialog><div id="notice" hidden role="status"></div><script>
'use strict';
const app=document.getElementById('app'),modal=document.getElementById('modal'),key='runlog.archive.v1';
let runs=[],noticeTimer;
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dayKey(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function fmtTime(sec){let s=Math.round(sec),m=Math.floor(s/60);return (m>=60?Math.floor(m/60)+':'+String(m%60).padStart(2,'0'):m)+':'+String(s%60).padStart(2,'0')}
function fmtPace(s){return fmtTime(s)}
function numberIT(n){return n.toLocaleString('it-IT',{maximumFractionDigits:2})}
function toast(msg){const n=document.getElementById('notice');n.hidden=false;n.textContent=msg;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>n.hidden=true,4800)}
function streak(){
 const week=d=>{const day=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);day.setDate(day.getDate()-(day.getDay()+6)%7);return day};
 const dates=new Set(runs.map(r=>dayKey(week(new Date(r.date+'T12:00:00')))));let d=week(new Date()),count=0;
 if(!dates.has(dayKey(d)))d.setDate(d.getDate()-7);
 while(dates.has(dayKey(d))){count++;d.setDate(d.getDate()-7)}return count
}
function ico(name){const paths={road:'M4 21 9 3m6 0 5 18M12 4v3m0 4v3m0 4v3',clock:'M12 7v5l4 2 M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0',flag:'M5 21V4c5-4 8 4 14 0v10c-6 4-9-4-14 0',plus:'M12 4v16M4 12h16',bars:'M4 20h17M6 16v-4m6 4V7m6 9V3'};return '<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="'+paths[name]+'"/></svg>'}
function trackArt(){
let lanes='';for(let j=0;j<13;j++){let r=41+j*5.6;lanes+='<rect x="'+(-99-r)+'" y="'+(-r)+'" width="'+(198+2*r)+'" height="'+2*r+'" rx="'+r+'" fill="none" stroke="'+(j===7?'#dcff77':'#a8d577')+'" opacity="'+(j===7?1:.25+j*.039)+'" stroke-width="'+(j===7?4:1.3)+'"/>'}
return '<svg class="shoe" viewBox="0 0 520 330" aria-hidden="true"><defs><pattern id="mesh" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".9" fill="#ccedaf" opacity=".35"/></pattern></defs><rect width="520" height="330" fill="url(#mesh)"/><g transform="translate(260 171) rotate(-29) skewX(-10) scale(1.13 .89)">'+lanes+'<path d="M54 -42v-68m7 68v-68" stroke="#e6f7d0" stroke-width="2"/><path id="lap" d="M-99 -80H99a80 80 0 0 1 0 160H-99a80 80 0 0 1 0 -160Z" fill="none"/><circle class="lapdot" r="6" fill="#fbffe2" stroke="#93c038" stroke-width="4"><animateMotion dur="10s" repeatCount="indefinite"><mpath href="#lap"/></animateMotion></circle></g><g fill="#a9be9b" font-family="monospace" font-size="10" letter-spacing="2"><text x="36" y="38">FIG. 01</text></g></svg>'}
function home(){
let total=runs.reduce((a,r)=>a+r.km,0),sec=runs.reduce((a,r)=>a+r.moving,0);
app.innerHTML='<section class="hero"><div class="hero-copy"><div class="eyebrow"><i class="dot"></i> Diario di allenamento</div><h1>Il tuo ritmo,<br><i>la tua corsa.</i></h1><p>Dal primo minuto di corsa al tuo nuovo record personale. Ritrova qui ogni allenamento.</p></div>'+trackArt()+'<span class="hero-index">PISTA DI ATLETICA &nbsp; / &nbsp; 400 M</span></section><div class="actions"><button class="action" onclick="go(\'new\')"><span class="iconbox">'+ico('plus')+'</span><span><b>Registra una corsa</b><small>Aggiungi percorso, tempi e intertempi</small></span><span class="arrow">↗</span></button><button class="action" onclick="go(\'stats\')"><span class="iconbox">'+ico('bars')+'</span><span><b>Attività e statistiche</b><small>Esplora il diario e i tuoi progressi</small></span><span class="arrow">↗</span></button></div><div class="liveEntry"><div><b>Vuoi registrarla mentre corri?</b><p>Avvia il GPS, metti in pausa e rivedi i dati prima di salvare.</p></div><button class="btn primary" onclick="go(\'live\')">Avvia corsa GPS ↗</button></div><div class="sectionhead"><div><span class="eyebrow muted">Archivio personale</span><h2>Il tuo riepilogo</h2></div></div><div class="readouts">'+[['road','Distanza totale',numberIT(total),'km'],['clock','In movimento',fmtTime(sec),''],['flag','Serie attuale',streak(),'sett.']].map(([i,l,v,u])=>'<div class="panel"><span class="micro">'+ico(i)+l+'</span><strong>'+v+' <small>'+u+'</small></strong></div>').join('')+'</div>';
}
function go(view){if(typeof liveState!=='undefined'&&liveState?.running&&view!=='live')pauseLive();if(modal.open)modal.close();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='live')showLive();else if(view==='new')showEditor();else if(view==='stats')showStats();else home();window.scrollTo(0,0)}
function recent(a){return [...a].sort((a,b)=>b.date.localeCompare(a.date)||String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')))}
function activityRow(r){return '<button class="arow" onclick="if(modal.open)modal.close();openRun(\''+r.id+'\')"><span class="iconbox">'+ico('road')+'</span><span><b>'+esc(r.title)+'</b><small>'+new Date(r.date+'T12:00:00').toLocaleDateString('it-IT')+' · '+numberIT(r.km)+' km · '+fmtTime(r.moving)+'</small></span><span class="arrow">↗</span></button>'}
function dialogBox(title,html){modal.innerHTML='<div class="dlghead"><h2>'+esc(title)+'</h2><button class="close" aria-label="Chiudi" onclick="modal.close()">×</button></div>'+html;if(!modal.open)modal.showModal()}
function openList(title,items){dialogBox(title,recent(items).map(activityRow).join('')||'<p>Ancora nessuna attività.</p>')}
modal.addEventListener('click',e=>{if(e.target===modal){let r=modal.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)modal.close()}});
function validRun(r){
 const pos=n=>Number.isFinite(n)&&n>0, arr=(v,f)=>Array.isArray(v)&&v.every(f);
 return r&&typeof r.id==='string'&&/^[a-zA-Z0-9_-]{1,100}$/.test(r.id)&&typeof r.title==='string'&&r.title.trim()&&typeof r.caption==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)&&dayKey(new Date(r.date+'T12:00:00'))===r.date&&pos(r.km)&&pos(r.moving)&&pos(r.elapsed)&&r.elapsed>=r.moving&&pos(r.weight)&&['easy','medium','hard'].includes(r.effort)&&(!r.samples||arr(r.samples,s=>s&&Number.isFinite(s.km)&&s.km>=0&&Number.isFinite(s.seconds)&&s.seconds>=0&&Number.isInteger(s.part)&&s.part>=0))&&(!r.routeBreaks||arr(r.routeBreaks,i=>Number.isInteger(i)&&i>=0&&i<r.points.length))&&(!r.actualPhases||(Array.isArray(r.actualPhases)&&r.actualPhases.length>0&&r.actualPhases.every((p,i)=>p&&typeof p.name==='string'&&p.name.trim()&&Number.isInteger(p.start)&&p.start<r.moving&&(i?p.start>r.actualPhases[i-1].start:p.start===0))))&&arr(r.points,p=>Array.isArray(p)&&p.length===2&&p.every(Number.isFinite)&&Math.abs(p[0])<=85.1&&Math.abs(p[1])<=180)&&arr(r.splits,s=>s&&pos(s.km)&&(s.seconds===null||pos(s.seconds))&&(s.elev==null||Number.isFinite(s.elev)))&&arr(r.bests,b=>b&&pos(b.km)&&pos(b.seconds))&&arr(r.blocks,b=>b&&['run','walk','fast','rest'].includes(b.type)&&['m','min'].includes(b.unit)&&pos(b.value)&&Number.isInteger(b.reps)&&b.reps>0)
}
function readStore(){const raw=localStorage.getItem(key);if(!raw)return [];const a=JSON.parse(raw);if(!Array.isArray(a)||!a.every(validRun))throw Error('Archivio illeggibile');return recent(a)}
function persist(change){try{let next=recent(change(readStore()));if(!next.every(validRun))throw Error('Dati non validi');localStorage.setItem(key,JSON.stringify(next));runs=next;return true}catch(e){alert('Salvataggio non riuscito. '+e.message+'. Puoi esportare una copia dal menu Backup.');return false}}
function saveRun(r){const completedGPS=!!r.fromGPS;delete r.fromGPS;r.updatedAt=new Date().toISOString();if(persist(a=>[r,...a.filter(x=>x.id!==r.id)])){localStorage.removeItem('runlog.editor.v1');if(completedGPS){localStorage.removeItem('runlog.live.v1');liveState=null}openRun(r.id);toast('Allenamento salvato. Medaglie aggiornate.');return true}return false}
function routineGroups(blocks){const groups=[];let last;for(const b of blocks){const group=b.group??0;if(!groups.length||last!==group)groups.push([]);groups[groups.length-1].push(b);last=group}return groups}
function deleteRun(id){const r=runs.find(x=>x.id===id);if(!r)return;
 dialogBox('Eliminare questa corsa?', '<p>«'+esc(r.title)+'» del '+new Date(r.date+'T12:00:00').toLocaleDateString('it-IT')+' verrà rimossa dal diario, dal calendario e dalle classifiche.</p><div class="confirmActions"><button class="btn" id="keepRun" autofocus>Annulla</button><button class="btn danger" id="confirmDelete">Elimina corsa</button></div>');
 document.querySelector('#keepRun').focus();document.querySelector('#keepRun').onclick=()=>modal.close();document.querySelector('#confirmDelete').onclick=()=>{if(persist(a=>a.filter(x=>x.id!==id))){go('stats');toast('Corsa eliminata.')}};
}
function backup(){dialogBox('Il tuo backup','<p>Esporta il diario in JSON e importa il file sull’altro dispositivo. Le attività presenti su un solo dispositivo vengono unite. Per le corse modificate viene conservata la versione più recente.</p><p class="muted">'+runs.length+' attività in questo browser</p><button class="btn primary" onclick="exportJSON()">↓ Esporta JSON</button> <button class="btn" onclick="document.getElementById(\'importFile\').click()">↑ Importa JSON</button><input id="importFile" hidden type="file" accept=".json,application/json" onchange="importJSON(this.files[0]);this.value=\'\'">')}
function exportJSON(){const url=URL.createObjectURL(new Blob([JSON.stringify({app:'Runlog',version:1,runs},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='runlog-'+dayKey(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
async function importJSON(file){if(!file)return;try{let v=JSON.parse(await file.text());if(v.app!=='Runlog'||v.version!==1||!Array.isArray(v.runs)||!v.runs.every(validRun))throw Error();let count=0;if(persist(local=>{let byId=new Map(local.map(r=>[r.id,r]));for(const r of v.runs){let old=byId.get(r.id);if(!old||String(r.updatedAt||'')>String(old.updatedAt||'')){byId.set(r.id,r);count++}}return [...byId.values()]})){go('stats');toast(count+' attività aggiunte o aggiornate.')}}catch{alert('File non valido. Scegli un backup JSON esportato da Runlog.')}}
function start(){try{runs=readStore()}catch{toast('Archivio locale non disponibile. Verifica le impostazioni del browser.')}go('home')}
window.addEventListener('storage',e=>{
 if(e.key!==key)return;
 try{runs=readStore();if(app.querySelector('.hero'))home();else toast('Diario aggiornato in un’altra scheda. Riapri la vista per aggiornarla.')}catch{toast('Impossibile rileggere il diario.')}
});

    document.querySelector('#lsPodium').innerHTML=[0,1,2].map((i)=>{
      const item=ranked[i];return `<div class="lsmedal"><span class="coin ${['gold','silver','bronze'][i]}">${i+1}</span>${item?`<button class="lslink" data-rank="${i}">${esc(item.r.title)}<small class="lsmeta">${dayLabel(item.r.date)}</small></button><strong>${fmtTime(item.s)}</strong>`:'<span class="lsmeta">Nessuna prestazione disponibile</span><span>—</span>'}</div>`;
    }).join('');
    document.querySelectorAll('[data-rank]').forEach(b=>b.onclick=()=>openRun(ranked[+b.dataset.rank].r.id));
  }
  function calendar(){
    const box=document.querySelector('#lsCalendar'),now=dayKey(new Date()), items=ordered(), days=new Set(items.map(r=>r.date));
    const year=month.getFullYear(),m=month.getMonth(), offset=(new Date(year,m,1).getDay()+6)%7;
    const label=month.toLocaleDateString('it-IT',{month:'long',year:'numeric'});
    box.innerHTML=`<div class="lshead"><h3 style="text-transform:capitalize">${label}</h3><div><button class="lsbtn" data-shift="-1" aria-label="Mese precedente">‹</button> <button class="lsbtn" data-shift="1" aria-label="Mese successivo">›</button></div></div><div class="cal">${['L','M','M','G','V','S','D'].map(x=>'<small>'+x+'</small>').join('')}${'<span></span>'.repeat(offset)}${Array.from({length:new Date(year,m+1,0).getDate()},(_,i)=>{
      const d=dayKey(new Date(year,m,i+1));return `<button class="${days.has(d)?'has':''} ${d===now?'today':''}" aria-label="${dayLabel(d)}${days.has(d)?', allenamento registrato':''}" aria-pressed="${selected===d}" data-day="${d}">${i+1}</button>`}).join('')}</div><div id="lsDay" class="daybox"></div>`;
    box.querySelectorAll('[data-shift]').forEach(b=>b.onclick=()=>{month=new Date(year,m+Number(b.dataset.shift),1);selected=null;calendar()});
    box.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selected=b.dataset.day;calendar()});
    const list=items.filter(r=>r.date===selected), dest=box.querySelector('#lsDay');
    dest.innerHTML=selected?`<span class="eyebrow">${dayLabel(selected)}</span>`:'';
    if(!list.length){dest.innerHTML+=`<p class="lsnote">${selected?'Nessuna corsa in questa data.':'Tocca una data evidenziata per rivedere il percorso.'}</p>`;return}
    list.forEach(r=>{const div=document.createElement('div');div.className='lsrow';div.innerHTML=activityRow(r)+`<small class="lsmeta">${fmt(r.km)} km · ${fmtTime(r.moving)} · ${fmtPace(r.moving/r.km)} /km</small>`;dest.append(div);
      if(r.points?.length){const map=document.createElement('div');map.className='daymap';div.append(map);mountMap(map,r.points,false,()=>{},{breaks:r.routeBreaks||[]})}
      else div.insertAdjacentHTML('beforeend','<small class="lsmeta">Percorso non registrato</small>');
    });
  }
  function chart(){
    const last=ordered().slice(0,10).reverse(),el=document.querySelector('#lsChart');
    document.querySelectorAll('[data-metric]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.metric===metric));
    if(!last.length){el.innerHTML='<p class="empty">La prima corsa farà comparire qui la sua distanza e durata.</p>';return}
    const isKm=metric==='km', vals=last.map(r=>isKm?r.km:r.moving/60), max=Math.max(...vals,1),w=600,h=200,step=530/last.length,bar=Math.min(42,step*.57);
    el.innerHTML=`<div class="chartwrap"><svg class="chart" viewBox="0 0 ${w} ${h}" aria-label="Ultimi allenamenti, ${isKm?'chilometri':'minuti in movimento'}" role="img">${[0,.5,1].map(y=>`<path d="M48 ${158-y*126}H585" stroke="#d9ddcf" stroke-dasharray="4 4"/><text x="40" y="${162-y*126}" text-anchor="end" font-size="12" fill="#65705d">${fmt(max*y,1)}</text>`).join('')}${last.map((r,i)=>{const x=50+(i+.5)*step,ht=126*vals[i]/max;return `<g><title>${esc(r.title)} · ${dayLabel(r.date)} · ${fmt(vals[i],1)} ${isKm?'km':'min'}</title><rect x="${x-bar/2}" y="${158-ht}" width="${bar}" height="${ht}" rx="4" fill="${i===last.length-1?'#8cb52a':'#536345'}"/><text x="${x}" y="${150-ht}" text-anchor="middle" font-size="12">${fmt(vals[i],1)}</text><text x="${x}" y="180" text-anchor="middle" font-size="12">${r.date.slice(8)}/${r.date.slice(5,7)}</text></g>`}).join('')}</svg></div>`;
  }
  function coaching(list){
    if(!list.length)return '<h3>Il tuo punto di partenza</h3><p>Registra una prima uscita e indica la fatica percepita per ricevere una proposta per la successiva.</p>';
    const r=list[0],pace=x=>x.moving/x.km;
    const pattern=x=>(x.blocks||[]).map(b=>[b.type,b.unit,b.value,b.reps,b.group??0].join('/')).join('|');
    const comparable=list.filter(x=>Math.abs(x.km/r.km-1)<=.2 && pattern(x)===pattern(r)).slice(0,4);
    const ready=r.effort==='easy'&&comparable.length>=2&&comparable[1].effort==='easy'&&pace(r)<=pace(comparable[1])*1.02;
    const walk=r.blocks?.find(b=>b.type==='walk'&&b.unit==='min'),run=r.blocks?.find(b=>b.type==='run'&&b.unit==='min');
    let tip;
    if(walk && run && routineGroups(r.blocks).length===1 && r.blocks.length===2){
      if(ready && run.value>=8)tip=`Prova ${fmt(Math.min(r.km,2))} km di corsa continua a ritmo comodo. Riprendi la camminata se ne senti il bisogno.`;
      else tip=`Alterna ${fmt(run.value+(ready?1:0))} min di corsa e ${fmt(walk.value)} min di cammino per circa ${fmt(r.km)} km.`;
    }else if(r.blocks?.length){tip='Ripeti la struttura dell’ultima seduta, mantenendo recuperi e numero di ripetizioni.'}
    else tip=`Prova ${fmt(ready?Math.round(r.km*1.05*100)/100:r.km)} km a ritmo comodo.`;
    if(r.effort==='hard')tip='L’ultima uscita ti è sembrata impegnativa. Quando ti senti recuperato, prova una seduta più breve a ritmo comodo.';
    const projection=comparable.length<3?'Servono almeno tre uscite con lo stesso schema e distanza entro il 20% dell’ultima per stimare una tendenza.':(()=>{
      const ps=comparable.map(pace), changes=ps.slice(0,-1).map((v,i)=>v-ps[i+1]).sort((a,b)=>a-b), mid=Math.floor(changes.length/2),trend=changes.length%2?changes[mid]:(changes[mid-1]+changes[mid])/2;
      const next=ps[0]+Math.max(-ps[0]*.05,Math.min(ps[0]*.05,trend));
      return `Su ${fmt(r.km)} km, la prossima uscita è stimata a <strong>${fmtTime(next*r.km)}</strong> (${fmtPace(next)} /km). La stima applica la variazione mediana del passo nelle ultime ${ps.length} uscite simili, limitata al 5% per seduta. Terreno e fatica possono cambiare il risultato.`;
    })();
    return `<span class="lsbadge">${ready?'Progressione leggera':'Consolidamento'}</span><p><strong>${tip}</strong></p><p class="lsnote">Proposta basata sull’ultima seduta e sulla fatica registrata. Per una progressione servono due uscite simili, facili e con passo stabile o in miglioramento.</p><div class="projection"><h3>Previsione della prestazione</h3><p class="lsnote">${projection}</p></div>`;
  }
  function render(){
    const list=ordered(), km=list.reduce((a,r)=>a+r.km,0),total=list.reduce((a,r)=>a+r.moving,0);
    selected=list[0]?.date||dayKey(new Date());month=localDate(selected);
    document.querySelector('#app').innerHTML=css+`<div class="ls"><div class="lshero"><span class="eyebrow">TRAINING LOG / 02</span><h1>Il tuo diario.</h1><p class="muted">Percorsi, tempi e progressi di ogni uscita.</p></div><div class="lsnums"><div><small>Distanza totale</small><strong>${fmt(km)} <small style="display:inline;font-size:.35em">km</small></strong></div><div><small>Allenamenti</small><strong>${list.length}</strong></div><div><small>In movimento</small><strong>${fmtTime(total)}</strong></div><div><small>Settimane consecutive</small><strong>${streak()}</strong></div></div><div class="lsgrid"><div><section class="panel"><div class="lshead"><div><span class="eyebrow">Archivio</span><h2>Ultime corse</h2></div><button id="lsAll" class="lsbtn">Vedi tutte ↗</button></div>${list.slice(0,3).map(activityRow).join('')||'<p class="empty">Il tuo diario è pronto per la prima corsa.</p>'}</section><section class="panel"><span class="eyebrow">Andamento</span><h2>Carico per uscita</h2><div><button class="lsbtn" data-metric="km">Distanza · km</button> <button class="lsbtn" data-metric="min">Tempo · min</button></div><div id="lsChart"></div><small class="lsmeta">Ultime 10 attività · dalla meno recente</small></section><section class="panel"><div class="lshead"><div><span class="eyebrow">Podio personale</span><h2>Le tue medaglie</h2></div><select id="lsTarget" aria-label="Distanza per il podio">${medalCategories().map(i=>`<option value="${i}" ${i===target?'selected':''}>${medalLabel(i)}</option>`).join('')}</select></div><div id="lsPodium"></div><p class="lsnote">Oro, argento e bronzo vengono assegnati automaticamente ai tre migliori tempi, una prestazione per corsa. Con il GPS usiamo i campioni del percorso. Con i dati manuali usiamo la corsa intera e gli intertempi misurati.</p></section></div><div><section class="panel"><span class="eyebrow">Calendario</span><h2>Giorni di corsa</h2><div id="lsCalendar"></div></section><section class="panel coach"><span class="eyebrow">Prossimo allenamento</span><h2>La prossima uscita</h2>${coaching(list)}</section></div></div></div>`;
    document.querySelector('#lsAll').onclick=()=>openList('Tutte le attività',list);
    document.querySelector('#lsTarget').onchange=e=>{target=Number(e.target.value);medals()};
    document.querySelectorAll('[data-metric]').forEach(b=>b.onclick=()=>{metric=b.dataset.metric;chart()});
    calendar();medals();chart();
  }
  return {render};
})();
function showStats(){logStats.render()}
start()</script></body></html>
